<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          display: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          body: ['Inter', 'system-ui', 'sans-serif'],
        },
        colors: {
          ink: '#1F1035',
          mute: '#6B7280',
          violet1: '#7C3AED',
          violet2: '#A855F7',
          amber1: '#F59E0B',
          mint1: '#10B981',
          coral1: '#FB7185',
          cream: '#FFFBF0',
          lavender: '#F0EEFF',
        },
        boxShadow: {
          'glow-violet': '0 10px 40px -10px rgba(124,58,237,0.35)',
          'glow-soft': '0 8px 30px -8px rgba(124,58,237,0.18)',
          'glow-amber': '0 10px 40px -10px rgba(245,158,11,0.35)',
          'glow-mint': '0 10px 40px -10px rgba(16,185,129,0.35)',
        },
      },
    },
  };
</script>
<style>
  html, body, #root { height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    color: #1F1035;
    background: #FAFAFA;
    overflow: hidden;
  }
  .font-display { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  .text-gradient {
    background: linear-gradient(90deg, #7C3AED 0%, #A855F7 40%, #FB7185 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .glass {
    background: rgba(255,255,255,0.72);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(124,58,237,0.15);
  }
  .scrollbar-hide::-webkit-scrollbar { display: none; }
  .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

  /* Pipeline flowing dashes */
  @keyframes dashflow { to { stroke-dashoffset: -32; } }
  .flow-dash { animation: dashflow 1.6s linear infinite; }

  /* Mesh blobs */
  @keyframes drift1 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(40px,-30px) scale(1.08)} }
  @keyframes drift2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-50px,20px) scale(1.12)} }
  @keyframes drift3 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(20px,40px) scale(0.95)} }
  .blob1 { animation: drift1 14s ease-in-out infinite; }
  .blob2 { animation: drift2 18s ease-in-out infinite; }
  .blob3 { animation: drift3 16s ease-in-out infinite; }

  /* Sparkle twinkle */
  @keyframes twinkle { 0%,100%{opacity:.3;transform:scale(1)} 50%{opacity:1;transform:scale(1.4)} }
  .twinkle { animation: twinkle 3s ease-in-out infinite; }

  /* Soft pulse ring */
  @keyframes ringpulse {
    0% { box-shadow: 0 0 0 0 rgba(124,58,237,0.45); }
    70% { box-shadow: 0 0 0 12px rgba(124,58,237,0); }
    100% { box-shadow: 0 0 0 0 rgba(124,58,237,0); }
  }
  .ring-pulse { animation: ringpulse 2s ease-out infinite; }

  /* Shimmer */
  @keyframes shimmer { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }
  .shimmer-on-hover:hover .shimmer-bar { animation: shimmer 1.1s ease forwards; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>

<div id="root"></div>
